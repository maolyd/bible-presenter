# Builds BiblePresenter-Setup.exe on a Windows machine provided free by GitHub.
#
#   * Every push and every manual run: tests on Windows, build, check the .exe and the installer,
#     and attach the Setup.exe to the run (Actions tab -> the run -> "Artifacts").
#   * Pushing a tag such as v1.0.0 also publishes the Setup.exe on the repository's Releases page.
name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version (e.g. 1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write          # needed to publish a release for v* tags

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Work out the version number
        shell: pwsh
        run: |
          $requested = "${{ github.event.inputs.release_version }}".Trim().TrimStart("v")
          if ($requested) { $v = $requested; "PUBLISH=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          elseif ($env:GITHUB_REF_TYPE -eq "tag") { $v = $env:GITHUB_REF_NAME.TrimStart("v"); "PUBLISH=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          else { $v = "1.0.$env:GITHUB_RUN_NUMBER" }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version $v"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install chromium

      - name: Run the automated tests on Windows
        id: tests
        continue-on-error: true      # keep building so one run also checks the .exe and installer
        shell: pwsh
        run: |
          python -m pytest -v --tb=short -rfE 2>&1 | Tee-Object -FilePath pytest-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Publish the failure details as an annotation (visible on the run page and through the API).
            $lines = @(Get-Content pytest-output.txt)
            $hit = $lines | Select-String -Pattern "= (FAILURES|ERRORS) =" | Select-Object -First 1
            $text = if ($hit) { $lines[($hit.LineNumber - 1)..($lines.Count - 1)] } else { $lines | Select-Object -Last 150 }
            $msg = $text -join "`n"
            if ($msg.Length -gt 60000) { $msg = $msg.Substring(0, 60000) }
            $msg = $msg.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Test failures::$msg"
            exit $code
          }

      - name: Build the program with PyInstaller
        run: python -m PyInstaller --noconfirm --clean BiblePresenter.spec

      - name: Check that the built program starts and serves the OBS page
        shell: pwsh
        run: |
          $env:BIBLE_PRESENTER_HOME = Join-Path $env:RUNNER_TEMP "bp-smoke"
          $p = Start-Process -FilePath "dist\BiblePresenter\BiblePresenter.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/presentation" -UseBasicParsing -TimeoutSec 5
              $ok = $r.StatusCode -eq 200
            } catch { }
            if ($p.HasExited) { break }
          }
          # On first start the program installs its bundled Bibles by itself: wait for all of them.
          $db = Join-Path $env:BIBLE_PRESENTER_HOME "bibles.sqlite"
          $bibles = "0"
          for ($i = 0; $i -lt 45 -and $ok -and -not $p.HasExited; $i++) {
            if (Test-Path $db) {
              $bibles = python -c "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); print(c.execute('select count(*) from translations where is_complete=1').fetchone()[0])" $db 2>$null
              if ($bibles -eq "2") { break }
            }
            Start-Sleep -Seconds 2
          }
          Write-Host "Complete Bibles installed on first start: $bibles"
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if ($ok -and $bibles -ne "2") { $ok = $false }
          $log = Join-Path $env:BIBLE_PRESENTER_HOME "bible-presenter.log"
          $tail = if (Test-Path $log) { (Get-Content $log -Tail 60) -join "`n" } else { "(no log file)" }
          Write-Host $tail
          if (-not $ok) {
            $msg = ("exited=" + $p.HasExited + "`n" + $tail).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=BiblePresenter.exe did not start::$msg"
            throw "BiblePresenter.exe did not start its presentation server."
          }
          Write-Host "BiblePresenter.exe started and served the OBS page."

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build BiblePresenter-Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer\BiblePresenter.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\*.exe

      - name: Check that the installer installs and uninstalls
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\BiblePresenter-Setup-*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "bp-install"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exited with code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\BiblePresenter.exe")) { throw "BiblePresenter.exe was not installed" }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstall exited with code $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\BiblePresenter.exe") { throw "Uninstall left the program behind" }
          Write-Host "Install and uninstall both worked."

      - name: Attach the installer to this run
        uses: actions/upload-artifact@v4
        with:
          name: BiblePresenter-Setup-${{ env.APP_VERSION }}
          path: dist/BiblePresenter-Setup-*.exe

      - name: Stop here if any test failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Publish a release
        if: env.PUBLISH == 'true' && steps.tests.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Bible Presenter ${{ env.APP_VERSION }}
          files: dist/BiblePresenter-Setup-*.exe
          body: |
            Download **BiblePresenter-Setup-${{ env.APP_VERSION }}.exe** below, double-click it and follow the steps.
            Windows may show "Windows protected your PC" because the installer is not code-signed: click More info -> Run anyway.
